[package]
name = "rosco-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Build, upload, and monitor programs for rosco_m68k"
license = "MIT"

[[bin]]
name = "rosco"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
include_dir = "0.7"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serialport = { version = "4.9", default-features = false }
toml = "0.9"
toml_edit = "0.25"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
