# ld65 configuration for a program in low RAM with one 32K bank mapped.
# Taken from the rosco_6502 sources, with the symbols cc65's C runtime
# needs added so that the same file links C and assembly projects.

SYMBOLS {
  __STACKSIZE__:        type = weak,    value = $0800;  # 2K C stack
  __STACKSTART__:       type = weak,    value = $C000;  # C stack grows down from here
  __ZPSTART__:          type = weak,    value = $0040;
  __ZPEND__:            type = weak,    value = $0100;
  __LOWRAMSTART__:      type = export,  value = $0800;
  __LOWRAMSIZE__:       type = export,  value = $3800;  # 14K application low-RAM
  __BANKRAMSTART__:     type = export,  value = $4000;
  __BANKRAMSIZE__:      type = export,  value = $8000;  # 32K high-RAM (one bank)
}
FEATURES {
    # Programs are loaded and started at the bottom of user low RAM.
    STARTADDRESS:       default = $0800;
}
MEMORY {
    ZP:         file = "", define = yes, start = __ZPSTART__,   size = __ZPEND__ - __ZPSTART__;
    MAIN:       file = %O,               start = %S,            size = __STACKSTART__ - __STACKSIZE__ - %S;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro,  optional = yes;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = rw;
    RODATA:   load = MAIN, type = rw;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define   = yes;
}
# Only C programs have constructors and destructors; an assembly project
# links exactly the same without them.
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
