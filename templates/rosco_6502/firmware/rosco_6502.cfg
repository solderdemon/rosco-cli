# ld65 configuration for a rosco_6502 firmware: code in ROM, vectors at the
# top of it, and RAM that nothing has initialised.
#
# The board has a 32KB ROM chip that it sees as four 8KB banks through the
# window at $E000. Bank 0 is the one selected at reset, so it holds the
# firmware; the other three are emitted empty to fill the chip out.
MEMORY {
    ZP:       file = "", start = $0040, size = $00C0, define = yes;
    RAM:      file = "", start = $0200, size = $3E00, define = yes;
    ROM:      file = %O, start = $E000, size = $1FFA, fill = yes, fillval = $FF;
    VECTORS:  file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $FF;
    BANK1:    file = %O, start = $E000, size = $2000, fill = yes, fillval = $FF;
    BANK2:    file = %O, start = $E000, size = $2000, fill = yes, fillval = $FF;
    BANK3:    file = %O, start = $E000, size = $2000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp,  optional = yes;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro,  optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes, define = yes;
    VECTORS:  load = VECTORS, type = ro;
}
